version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades need a manual migration; Expo SDK packages move together with `pnpm expo install --fix`
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
